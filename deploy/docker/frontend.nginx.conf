server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Файлы с хешем в имени (JS, CSS, шрифты, картинки из src/assets) — кешируются навсегда:
    # новый файл получает новое имя, поэтому замена видна сразу
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Музыка без хеша, но треки не меняются под тем же именем — на неделю.
    # manifest.json сюда не попадает: он меняется при каждом деплое и идёт через location /
    location ~* \.(mp3|m4a|ogg)$ {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Остальные картинки без хеша (аватар, og.png, фавикон) — на час, потом браузер показывает
    # старую и тихо проверяет новую: заменённый аватар виден уже со следующего захода
    location ~* \.(webp|png|jpe?g|gif|svg|ico)$ {
        access_log off;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
